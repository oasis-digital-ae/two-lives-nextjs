<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- 🔥 THE CRITICAL LINE THAT FIXES SHRINKING -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/admin/admin.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/admin/supabase.js"></script>
</head>

<body>

<div class="login-wrapper">

  <div class="login-box">

    <div class="login-header">
      <i class="ri-shield-keyhole-line icon"></i>
      <h2>Admin Login</h2>
      <p>Enter your credentials to continue</p>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-with-icon">
        <i class="ri-mail-line"></i>
        <input id="email" type="email" placeholder="admin@example.com">
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-with-icon">
        <i class="ri-lock-line"></i>
        <input id="password" type="password" placeholder="Enter password">
        <i id="togglePass" class="ri-eye-off-line toggle-icon"></i>
      </div>
    </div>

    <button id="loginBtn" class="login-btn">Login</button>
    <p id="msg" class="msg"></p>

  </div>

</div>

<script>
document.getElementById("togglePass").onclick = function () {
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
  this.classList.toggle("ri-eye-line");
  this.classList.toggle("ri-eye-off-line");
};

document.getElementById("loginBtn").onclick = async function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if (!email || !password) {
    msg.innerText = "Email and password are required.";
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    msg.innerText = "Invalid email or password.";
    return;
  }

  window.location.href = "/admin/dashboard.html";
};
</script>

</body>
</html>
