<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e1412">

  <title>Reset password · Two Lives Theory</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css">
  <link rel="stylesheet" href="/admin/admin-theme.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="shortcut icon" href="/images/favicon.svg">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/admin/supabase.js"></script>
</head>

<body>

<div class="login-wrapper">
  <div class="login-box">

    <div class="login-header">
      <img class="logo" src="/images/two-lives/logo-wht.svg" alt="Two Lives Theory">
      <h2 id="title">Reset password</h2>
      <p id="subtitle">We'll email you a reset link</p>
    </div>

    <!-- Step 1: ask for the reset email -->
    <form id="requestForm" novalidate hidden>
      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-with-icon">
          <i class="ri-mail-line"></i>
          <input id="email" type="email" autocomplete="username" placeholder="you@twolivestheory.com">
        </div>
      </div>

      <button id="requestBtn" class="login-btn" type="submit">Send reset link</button>
      <p id="requestMsg" class="msg" aria-live="polite"></p>
    </form>

    <!-- Step 2: set the new password (shown when opened from the email link) -->
    <form id="updateForm" novalidate hidden>
      <div class="form-group">
        <label for="newPassword">New password</label>
        <div class="input-with-icon">
          <i class="ri-lock-2-line"></i>
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters">
          <i id="togglePass" class="ri-eye-off-line toggle-icon" role="button" aria-label="Show password"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm new password</label>
        <div class="input-with-icon">
          <i class="ri-lock-2-line"></i>
          <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter password">
        </div>
      </div>

      <button id="updateBtn" class="login-btn" type="submit">Update password</button>
      <p id="updateMsg" class="msg" aria-live="polite"></p>
    </form>

    <p class="login-foot"><a href="/admin/login.html">Back to sign in</a></p>

  </div>
</div>

<script>
const requestForm = document.getElementById("requestForm");
const updateForm  = document.getElementById("updateForm");
const title       = document.getElementById("title");
const subtitle    = document.getElementById("subtitle");

function showRequest(note) {
  title.innerText = "Reset password";
  subtitle.innerText = "We'll email you a reset link";
  requestForm.hidden = false;
  updateForm.hidden = true;
  if (note) document.getElementById("requestMsg").innerText = note;
}

function showUpdate() {
  title.innerText = "Choose a new password";
  subtitle.innerText = "Enter a new password for your admin account";
  requestForm.hidden = true;
  updateForm.hidden = false;
}

// Decide which step to show.
(async function init() {
  const hash   = new URLSearchParams(location.hash.replace(/^#/, ""));
  const params = new URLSearchParams(location.search);

  // Supabase reports bad/expired links via the hash (or query) fragment.
  const err = hash.get("error_description") || params.get("error_description");
  if (err) {
    history.replaceState(null, "", location.pathname);
    showRequest(err + " Request a new link below.");
    return;
  }

  // PKCE-style link: ?code=... needs an explicit exchange.
  const code = params.get("code");
  if (code) {
    const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
    history.replaceState(null, "", location.pathname);
    if (error) { showRequest("That reset link is invalid or has expired. Request a new one below."); return; }
    showUpdate();
    return;
  }

  // Implicit-style link: #access_token=...&type=recovery — supabase-js picks it
  // up on load, so just wait for the recovery session to land.
  if (hash.get("access_token")) {
    const { data } = await supabaseClient.auth.getSession();
    history.replaceState(null, "", location.pathname);
    if (data.session) { showUpdate(); return; }
  }

  showRequest();
})();

document.getElementById("togglePass").onclick = function () {
  const pass = document.getElementById("newPassword");
  pass.type = pass.type === "password" ? "text" : "password";
  this.classList.toggle("ri-eye-line");
  this.classList.toggle("ri-eye-off-line");
};

requestForm.onsubmit = async function (e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const msg   = document.getElementById("requestMsg");
  const btn   = document.getElementById("requestBtn");

  msg.innerText = "";

  if (!email) { msg.innerText = "Email address is required."; return; }

  btn.disabled = true;
  btn.innerText = "Sending…";

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + "/admin/reset-password"
  });

  btn.disabled = false;
  btn.innerText = "Send reset link";

  // Rate limits are worth surfacing — otherwise a blocked request looks like a
  // sent email that never arrives.
  if (error && (error.status === 429 || /rate limit/i.test(error.message))) {
    msg.innerText = "Too many reset requests. Wait a minute and try again — " +
                    "and check your inbox, an earlier link may already be there.";
    return;
  }

  // Otherwise the same message whether or not the account exists.
  msg.innerText = "If that email has an admin account, a reset link is on its way.";
};

updateForm.onsubmit = async function (e) {
  e.preventDefault();

  const password = document.getElementById("newPassword").value;
  const confirm  = document.getElementById("confirmPassword").value;
  const msg      = document.getElementById("updateMsg");
  const btn      = document.getElementById("updateBtn");

  msg.innerText = "";

  if (password.length < 8) { msg.innerText = "Password must be at least 8 characters."; return; }
  if (password !== confirm) { msg.innerText = "Passwords do not match."; return; }

  btn.disabled = true;
  btn.innerText = "Updating…";

  const { error } = await supabaseClient.auth.updateUser({ password });

  if (error) {
    btn.disabled = false;
    btn.innerText = "Update password";
    msg.innerText = error.message;
    return;
  }

  msg.innerText = "Password updated. Redirecting to sign in…";
  await supabaseClient.auth.signOut();
  setTimeout(() => { window.location.href = "/admin/login.html"; }, 1500);
};
</script>

</body>
</html>
